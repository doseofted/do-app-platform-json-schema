name: Weekly app_spec.json update

on:
  schedule:
    # Weekly on Mondays at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-app-spec-update
  cancel-in-progress: false

jobs:
  update-app-spec:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate app_spec.json
        run: node index.js

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create update branch
        run: |
          BRANCH="automation/app-spec-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"

      - name: Commit app_spec.json if changed
        run: |
          if git diff --quiet -- app_spec.json; then
            echo "No changes to app_spec.json; skipping PR."
            exit 0
          fi

          git add app_spec.json
          git commit -m "chore: update app_spec.json"
          git push -u origin "$BRANCH"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "chore: weekly app_spec.json update" \
            --body "Automated weekly update of \`app_spec.json\` generated by running \`node index.js\` against the upstream OpenAPI spec." \
            --base main \
            --head "$BRANCH"
